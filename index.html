<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8EC">
  <meta name="description" content="제과·제빵 기능사 실기 연습 노트">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="반죽일기">
  <title>반죽일기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/logo/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/logo/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title"><a href="#home"><img src="images/logo/icon.svg" alt="" width="28" height="28">반죽일기</a></h1>
    </header>

    <main class="app-main">
      <section class="screen" id="screen-home" data-screen="home">
        <div id="home-view"></div>
      </section>

      <section class="screen" id="screen-items" data-screen="items" hidden>
        <div id="items-list-view">
          <div class="screen-head">
            <h2 class="screen-title">품목</h2>
            <a class="btn btn-outline btn-small" href="#items/new">+ 품목 추가</a>
          </div>

          <div class="segmented" role="group" aria-label="제과·제빵">
            <button type="button" class="segmented-btn" data-category="제빵">제빵</button>
            <button type="button" class="segmented-btn" data-category="제과">제과</button>
          </div>

          <label class="search">
            <span class="visually-hidden">품목 이름 검색</span>
            <input class="input" type="search" id="items-search" placeholder="품목 이름 검색" autocomplete="off">
          </label>

          <div class="chips" role="group" aria-label="품목 필터">
            <button type="button" class="chip" data-filter="all">전체</button>
            <button type="button" class="chip" data-filter="exam">실기</button>
            <button type="button" class="chip" data-filter="mine">내 품목</button>
          </div>

          <div id="items-list" class="item-list" aria-live="polite"></div>
        </div>

        <div id="items-detail-view" hidden></div>

        <div id="items-editor-view" hidden></div>
      </section>

      <section class="screen" id="screen-practice" data-screen="practice" hidden>
        <div id="practice-view"></div>
      </section>

      <section class="screen" id="screen-analysis" data-screen="analysis" hidden>
        <div id="analysis-view"></div>
      </section>

      <section class="screen" id="screen-records" data-screen="records" hidden>
        <div id="records-gallery-view"></div>
        <div id="records-form-view" hidden></div>
        <div id="records-detail-view" hidden></div>
      </section>

      <section class="screen" id="screen-settings" data-screen="settings" hidden>
        <div id="settings-view"></div>
      </section>
    </main>

    <a class="practice-banner" id="practice-banner" href="#practice" hidden></a>

    <nav class="tab-bar" aria-label="주요 메뉴">
      <a class="tab" href="#home" data-tab="home">홈</a>
      <a class="tab" href="#items" data-tab="items">품목</a>
      <a class="tab" href="#records" data-tab="records">기록</a>
      <a class="tab" href="#settings" data-tab="settings">설정</a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
